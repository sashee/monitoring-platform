# A workspace with the receiver at the root rather than moved under `crates/`. Keeping
# `monitoring-platform` where it is means `src/`, `tests/`, every path in SPEC.md and the
# nix package's `keep` list all stay valid; only the new members are new paths.
[workspace]
members = ["crates/mp-host", "crates/mp-collector"]

# Single source of truth for every version used by more than one crate, so the receiver and
# the collector can never drift onto different `libc` or `opentelemetry-proto` releases —
# which for two processes that must agree on OTLP wire encoding would be a real hazard, not
# just untidy.
[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive", "env"] }
libc = "0.2.189"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14.4"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[package]
name = "monitoring-platform"
version = "0.1.0"
edition = "2024"
# The consuming NixOS system builds this with its OWN rustPlatform (see SPEC.md §9.3), so an
# older host toolchain must fail with a clear message here rather than somewhere deep in a
# dependency. 1.95 is the *verified* floor: it is what nixos-26.05 ships and what
# `nix-build nix -A package` passes against. Edition 2024's own floor is 1.85, but nothing
# below 1.95 has been tested, so claiming it would be unfounded. Lowering this means
# actually building with the lower toolchain first.
rust-version = "1.95"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = "0.23.0"
blake3 = "1.8.5"
clap = { workspace = true }
flate2 = "1.1.9"
jiff = "0.2.35"
mp-host = { path = "crates/mp-host" }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sd-notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
http-body-util = "0.1.4"
# Only the end-to-end test signals the spawned child directly; the adjtimex(2) read that used
# to need this at build time now lives in mp-host.
libc = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
